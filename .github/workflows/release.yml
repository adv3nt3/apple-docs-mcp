name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Release to npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    # Job-level env: GitHub forbids `secrets.*` in step-level `if:` conditions,
    # so we hoist the boolean here. Steps gate on `env.HAS_NPM_TOKEN`.
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test:ci

      - name: Build
        run: pnpm run build

      - name: Prune to production node_modules
        # Match the brew formula's runtime tree: production deps only,
        # --ignore-scripts to skip esbuild/unrs-resolver native postinstalls
        # (devDep-only optimisations that would otherwise need PNPM-10's
        # interactive consent and don't ship in the bottle).
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile --prod --ignore-scripts

      - name: Package bottle tarball
        # Layout matches what Formula/apple-docs-mcp.rb expects at libexec/:
        # dist contents at top level (`cp package.json dist/` in the build
        # script also lands package.json under dist/), plus production
        # node_modules. Formula does `libexec.install Dir["*"]`.
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          STAGING=$(mktemp -d)
          cp -r dist/* "$STAGING/"
          cp -r node_modules "$STAGING/node_modules"
          cp LICENSE "$STAGING/" 2>/dev/null || true
          tar -C "$STAGING" -czvf "apple-docs-mcp-${VERSION}.tar.gz" .
          shasum -a 256 "apple-docs-mcp-${VERSION}.tar.gz" \
            > "apple-docs-mcp-${VERSION}.tar.gz.sha256"
          ls -lh "apple-docs-mcp-${VERSION}.tar.gz" \
                 "apple-docs-mcp-${VERSION}.tar.gz.sha256"

      - name: Verify package
        run: |
          # Check package.json version matches tag
          PACKAGE_VERSION=v$(node -p "require('./package.json').version")
          TAG_NAME=${GITHUB_REF#refs/tags/}

          if [ "$PACKAGE_VERSION" != "$TAG_NAME" ]; then
            echo "❌ Package version ($PACKAGE_VERSION) doesn't match tag ($TAG_NAME)"
            exit 1
          fi

          echo "✅ Version check passed: $PACKAGE_VERSION"

      - name: Publish to npm
        if: env.HAS_NPM_TOKEN == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Skip npm publish (no NPM_TOKEN secret configured)
        if: env.HAS_NPM_TOKEN == 'false'
        run: |
          echo "::notice::NPM_TOKEN secret is not configured for this repo."
          echo "::notice::Skipping npm publish. The GitHub release + tarball is still produced."
          echo "::notice::To enable publishing, add an NPM_TOKEN secret with publish access to @adv3nt3/apple-docs-mcp."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          generate_release_notes: true
          files: |
            apple-docs-mcp-*.tar.gz
            apple-docs-mcp-*.sha256
          body: |
            ## 🍺 Homebrew

            ```bash
            brew install adv3nt3/tap/apple-docs-mcp
            ```

            ## 🚀 npm

            ```bash
            npm install @adv3nt3/apple-docs-mcp
            ```

            ## 📦 What's included
            - Complete WWDC video data (1260+ videos)
            - 18 MCP tools for Apple documentation
            - Full TypeScript support
            - Bundled data (no external dependencies)

            ## 📝 Changelog
            See the [full changelog](https://github.com/adv3nt3/apple-docs-mcp/blob/main/CHANGELOG.md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}